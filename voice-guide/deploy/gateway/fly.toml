# The public gateway on Fly.io (ADR-0053). One machine with the memory store: sessions live in
# memory and the committed knowledge base is activated at start. Secrets (never in this file):
#   fly secrets set VG_SECRET=... VG_ADMIN_TOKEN=... ANTHROPIC_API_KEY=... \
#     VG_WHISPER_URL=... VG_WHISPER_TOKEN=... [VG_VOICETUT_URL=...]
app = "vg-public-demo"
primary_region = "fra"

[build]
  dockerfile = "gateway.Dockerfile"

[env]
  VG_PUBLIC = "on"
  VG_PUBLIC_URL = "https://vg-public-demo.fly.dev"
  VG_CLIENT_IP_HEADER = "fly-client-ip"
  VG_STORE = "memory"
  VG_TRAIL = "on"
  VG_LLM_PROVIDER = "anthropic"
  VG_LLM_EFFORT = "low"
  VG_AGENT_TOKENS_PER_SITE_DAY = "3000000"
  # VoiceTut for public visitors, capped per day (owner, 2026-11-13; ADR-0053 §5): new sentences
  # per site per day (cache hits are free); past the cap visitors hear the browser voice.
  VG_VOICETUT_SENTENCES_PER_DAY = "300"
  VG_STT_SECONDS_PER_DAY = "14400"
  VG_RATE_TURNS_PER_MIN = "20"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # One machine: the memory store is per process, so a second one would split sessions.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
