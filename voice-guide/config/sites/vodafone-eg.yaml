# Vodafone Egypt live site (Vodafone live phase). Facts behind every value:
# docs/reference/vodafone-live-site-audit.md. Specs: SPEC-03 (integration), SPEC-04 (sync).
#
# Crawled for real on 2026-10-23, public pages only, through the in-browser crawler (ADR-0032).
# Scheduled crawling is paused (see `sync:`); runs are on demand.
id: vodafone-eg
name: { ar: ڤودافون مصر, en: Vodafone Egypt }
languages: [ar, en]
defaultLanguage: ar
# Public key placed in the script tag or injected by the demo browser (ADR-0022, ADR-0026).
siteKey: pk_vodafone_eg

origins:
  - url: https://web.vodafone.com.eg
    key: web
  - url: https://eshop.vodafone.com.eg
    key: shop

crawl:
  # Seeds: the real navigation (audit §8), both languages. SPEC-04 renames this to `seeds`.
  start:
    - https://web.vodafone.com.eg/ar/home
    - https://web.vodafone.com.eg/en/home
    - https://web.vodafone.com.eg/ar/mobile-internet-bundles
    - https://web.vodafone.com.eg/en/mobile-internet-bundles
    - https://web.vodafone.com.eg/ar/vodafone-rate-plans
    - https://web.vodafone.com.eg/en/vodafone-rate-plans
    - https://web.vodafone.com.eg/ar/vodafone-red1
    - https://web.vodafone.com.eg/en/vodafone-red1
    - https://web.vodafone.com.eg/en/vodafone-flex
    - https://web.vodafone.com.eg/ar/kart-el-korout
    - https://web.vodafone.com.eg/en/kart-el-korout
    - https://web.vodafone.com.eg/ar/wireless-net
    - https://web.vodafone.com.eg/en/wireless-net
    - https://web.vodafone.com.eg/en/HomeDSLcatalog
    - https://web.vodafone.com.eg/ar/services
    - https://web.vodafone.com.eg/en/services
    - https://web.vodafone.com.eg/ar/promotions
    - https://web.vodafone.com.eg/en/promotions
    - https://web.vodafone.com.eg/ar/vodafone-cash
    - https://web.vodafone.com.eg/en/vodafone-cash
    - https://web.vodafone.com.eg/en/wifi-calling
    - https://web.vodafone.com.eg/en/anavodafone
    - https://web.vodafone.com.eg/ar/faq
    - https://web.vodafone.com.eg/en/faq
    - https://web.vodafone.com.eg/en/contact-us
    - https://web.vodafone.com.eg/spa/storeLocator
    - https://web.vodafone.com.eg/spa/NetworkCoverageChecker
    - https://web.vodafone.com.eg/spa/contact-us
    - https://eshop.vodafone.com.eg/en/
    - https://eshop.vodafone.com.eg/ar/
    - https://eshop.vodafone.com.eg/en/internetServices/dsl/bundles
  include:
    - '^https://web\.vodafone\.com\.eg/(en|ar|spa)/'
    - '^https://eshop\.vodafone\.com\.eg/(en|ar)/'
  exclude:
    # Test, hidden and legacy pages seen in the sitemaps (audit §7).
    - '/(bbbbbbb|sssssss|xxxxx|lorem|x?test\d*|testing4admin|admin-liferay|hiddenpages|dont-remove-the-page|iframes|asset-publisher|formtest|loadbalancercheck|home-compound-test|empty-page|lock-sample|message-board|revamp-)'
    # Article series, CSR and ESG pages: outside the personal-products demo scope.
    - '/(en|ar)/(ezayak-|esg-|sustainab|vodafone-egypt-and-|vodafone-business-and-)'
    - '(-old|_old|_rd|-bkp|_backup|-backup|_hid)(\?|#|$)'
    - 'nudge'
    - '/(en|ar)/\d+(\?|#|$)'
    # Terms pages: not guidance destinations (add back per page in the overlay if needed).
    - '(terms|t-c|tandc|termsandconditions|tcs)'
    # Business, foundation, corporate and investor pages: outside the personal-products demo scope.
    - '/(en|ar)/(business|foundation|vodafone-egypt1|enterprise|public-sector|about-us|corporate|investor|our-purpose|social-|community|v-hub|newsroom|events|management)'
    - '/(en|ar)/[^/]*(business|machine-to-machine|smart-meter|iot|m2m|sd-wan|cloud|fleet|dedicated-internet|co-location|ready-)'
    # Enterprise products, careers and staff pages linked from personal pages (seen in the 2026-10-23 crawl).
    - '/(en|ar)/(office-4g|3arabety|AI|ai|connectivity|fixed-connectivity|sdwan[^/]*|virtual-servers|disaster-recovery|fleet[^/]*|Fleet|techies-hub|early-careers|development-tools|vodafone_scoop|c-nam|el-asly-plus[^/]*)(\?|#|$)'
    # Arabic-slug privacy notice and smart-meter pages (percent-encoded paths).
    - '/ar/(%D8%A7%D8%B4%D8%B9%D8%A7%D8%B1-%D8%A7%D9%84%D8%AE%D8%B5%D9%88%D8%B5%D9%8A%D8%A9|%D8%A7%D9%84%D8%B4%D8%A8%D9%83%D8%A9-%D8%A7%D9%84%D8%B0%D9%83%D9%8A%D8%A9)'
    # News archive, people pages and careers: outside the personal-products demo scope.
    - '/(en|ar)/(latest-news|latest-vodafone-egypt-news|vodafone-egypt-press-releases|\d{4}-news|press-|careers|executive-team|our-history|history|working-at-vodafone|risk-awareness|tv%20commercials|TV%20Commercials|join-vodafone|privacy|exposure-)'
    # Logged-in and transactional journeys (shop robots.txt; SPEC-04 §2) and logged-in SPA views.
    - '^https://eshop\.vodafone\.com\.eg/(en/|ar/)?(cart|checkout|wishlist|register|account)'
    - '[?&](Color|Storage|Size|variantID)='
    - '^https://web\.vodafone\.com\.eg/spa/(myHome|miManagement)'
  maxPages: 220
  # The navigation pages and the pages they link to, twice removed (ADR-0028).
  maxDepth: 2
  # The shop's category lists differ only by query string.
  keepQuery: [categoryUrls]
  # SPEC-04 §4: at most 2 pages at a time per origin, about 1 page per second.
  concurrency: 2
  delayMs: 1000
  # PUBLIC PAGES ONLY (owner's instruction, 2026-10-23): no cookies, no signed-in account;
  # any page that shows a password field or a login URL is skipped and listed in the report.
  publicOnly: true
  cookies: []
  collections: { minItems: 3 }
  # Removed before extraction: cookie banner and Vodafone's accessibility widget (audit §3, §5).
  ignoreSelectors: ['#onetrust-banner-sdk', '#onetrust-consent-sdk', '#onetrust-pc-sdk', '.onetrust-pc-dark-filter', 'accessibility-widget', '#vodafone-aw-icon']
  # The /spa/ Angular app needs its scripts to render; content pages are crawled without them.
  scriptsFor: '^/spa/'
  # Change detection only, never discovery (ADR-0028).
  sitemaps:
    - https://web.vodafone.com.eg/site-a/sitemap-en.xml
    - https://web.vodafone.com.eg/site-a/sitemap-ar.xml
  userAgent: VodafoneEG-VoiceGuide-Crawler/0.1
  # No hreflang on the live site; /en/<slug> and /ar/<slug> are the same page (audit §6).
  pairLanguagesBy: path

# SCHEDULED CRAWLING IS PAUSED (owner's instruction, 2026-10-23, and PRD D3: no scheduled
# crawl of production before Vodafone's written approval). On-demand runs only:
#   npm run sync -- --site vodafone-eg
# `npm run sync -- --scheduled` (what a cron would call) refuses while `enabled` is false.
sync:
  schedule:
    enabled: false
    everyMinutes: 120
    window: '07:00-23:00'
    timezone: Africa/Cairo
  gate:
    maxDestinationChurn: 0.15
    requireSeeds: true
    evalCases: tests/fixtures/vodafone-utterances.yaml
    maxEvalDrop: 0.02
  keepVersions: 10

curated: config/curated/vodafone-eg.yaml

speech:
  # Egyptian Arabic, whatever the page's lang attribute says (it says ar-SA; audit §6).
  stt: { ar: ar-EG, en: en-US }
  tts: { ar: ar-EG, en: en-US }
  onDevice: prefer

ui:
  # Fixed Vodafone tokens (ADR-0029) and the microphone launcher (ADR-0027).
  theme: vodafone
  voiceFirst: true
  accent: '#e60000'
  position: end
  xray: button

router:
  decider: local
  acceptAt: 0.55
  clarifyAt: 0.3
  topK: 8

agent:
  enabled: true
  maxSteps: 12
  timeoutSec: 60

watch:
  enabled: true
  intervalSec: 900

# Exploration Trail (SPEC-06). Off for the live site until D2 (data protection) approves the consent
# wording and retention; `npm run demo:live -- --trail` turns it on for one demo session.
# Aggregation stays off (ADR-0037 §6).
trail:
  enabled: false
  retentionHours: 24
  # The journey is shown in the Pocket of the Services clone (ADR-0040), mounted at /en/services in the demo.
  hostUrl: https://web.vodafone.com.eg/en/services#journey
  # Vodafone's CMS serves pictures from /documents/<ids>?t=… (no extension): let memories show them.
  replayAssetPaths: [/documents/]
  aggregation: { enabled: false, minCohort: 20 }
