collections:
  # Arabic page: the "Vodafone Plus" tab of bundle cards (audit §9).
  - id: web.mobile-internet-bundles.vodafone-plus
    labels:
      ar: [باقات ڤودافون بلس, باقات بلس, باقات النت]
  # English page: same bundles, different markup.
  - id: web.mobile-internet-bundles.plus--37---600egp
    labels:
      en: [Vodafone Plus bundles, plus bundles, internet bundles]
    # The English cards carry the data amount in the header ("1400 Mega"), as the Arabic ones do.
    fields:
      data: { css: 'div.card-subscription.radius > div.card-subscription-header > h5.card-subscription-header-title.color-red', type: data }

destinations:
  # Most "internet bundle" requests mean the mobile Plus bundles; home internet must be named.
  - id: web.mobile-internet-bundles.vodafone-plus
    priority: 1.4
    labels:
      ar: [باقات النت, باقات الإنترنت, باقات الانترنت, باقات بلس, باقات ڤودافون بلس, باقة نت]
    examples:
      ar: [إيه أرخص باقة نت, عايز باقة نت رخيصة, إيه أكبر باقة نت, باقات النت بكام, وريني باقات النت]
    flows: [subscribe]
  - id: web.mobile-internet-bundles.plus--37---600egp
    priority: 1.4
    labels:
      en: [internet bundles, mobile internet bundles, data bundles, plus bundles, internet bundle]
    examples:
      en: [what's the cheapest internet bundle, which bundle has the most data, show me the internet bundles, how much are the data bundles]
    flows: [subscribe]
  # The store finder's search box (seen on the live page 2026-10-23: #keyword, with city and area lists).
  - id: web.spa-storelocator.search
    pageId: web.spa-storelocator
    kind: section
    target: { css: ['#keyword', 'input[type="search"]'], text: {} }
    labels:
      ar: [ابحث عن فرع, دور على فرع, أقرب فرع, فين أقرب فرع]
      en: [search for a store, find a store, nearest store, store search]
    examples:
      ar: [فين أقرب فرع, عايز أروح فرع ڤودافون, فين فرع ڤودافون]
      en: [where's the nearest store, find a vodafone store near me, where can I find a store]
    priority: 1.3
  # Page watch on the offers list.
  - id: web.promotions.check-out-our-latest-offers-and-choose-y
    watchable: true
    labels:
      ar: [العروض, عروض ڤودافون]
      en: [offers, the offers, promotions]
  - id: web.spa-networkcoveragechecker
    priority: 1.2
  - id: web.spa-vodafone-flex
    priority: 1.2
    examples:
      ar: [عايز أعرف عن فليكس, أنظمة فليكس]
      en: [tell me about flex, vodafone flex plans]
  - id: web.wireless-net
    priority: 1.2
  - id: web.spa-faq
    priority: 1.3
    examples:
      ar: [عندي سؤال, الأسئلة الشائعة]
      en: [frequently asked questions, I have a question]
  - id: web.vodafone-cash
    priority: 1.2
  - id: web.vodafone-red1
    priority: 1.2

visuals:
  # The bundles page hero has its Arabic copy inside the picture (audit §9). Described from the
  # live page on 2026-10-23; re-check after every sync (it changes with campaigns).
  - id: web.mobile-internet-bundles.pablo
    confidence: 0.9
    description:
      ar: 'إعلان ڤودافون بلس: «لما يبقى مفيش زيك متنافسش إلا نفسك». جدد باقة ڤودافون بلس وصوّت من تطبيق أنا ڤودافون عشان تكسب بلايستيشن 5.'
      en: 'A Vodafone Plus ad: "When there is no one like you, you only compete with yourself". Renew your Vodafone Plus bundle and vote in the Ana Vodafone app to win a PlayStation 5.'

flows:
  # Public pages only (ADR-0032): the guide shows where to subscribe and stops. Subscribing happens
  # in Vodafone's signed-in app, which the guide neither signs in to nor confirms.
  - id: subscribe
    labels:
      ar: [اشترك, الاشتراك, اشتراك, فعّل الباقة, أشترك, اشتري, أشتري, اشتريلي, شراء]
      en: [subscribe, sign up, buy this bundle, activate, buy]
    examples:
      ar: [أشترك فيها إزاي, عايز أشترك في الباقة دي, اشتركلي فيها, اشترك فيها]
      en: [how do I subscribe to it, subscribe me to this bundle, I want to buy it, subscribe to it]
    appliesTo: { collectionIds: [web.mobile-internet-bundles.vodafone-plus, web.mobile-internet-bundles.plus--37---600egp] }
    steps:
      - op: spotlight
        target: { css: ['a[href*="miManagement"]', 'a.btn'], within: item, text: { ar: اشترك الاّن, en: Subscribe now } }
        caption: { ar: اشترك من هنا, en: Subscribe here }
      - op: confirm
        target: { css: ['a[href*="miManagement"]', 'a.btn'], within: item, text: { ar: اشترك الاّن, en: Subscribe now } }
        message:
          ar: 'دوس «اشترك الآن» بنفسك، وهتدخل على حسابك في ڤودافون وتأكد الاشتراك هناك. أنا مش بدخل على الحسابات ولا بأكد اشتراكات.'
          en: 'Press "Subscribe now" yourself. You will sign in to your Vodafone account and confirm there. I do not sign in or confirm subscriptions.'
