# Curated overlay for vodafone-eg (ADR-0011): only what the crawler cannot know.
#
# Ids come from the knowledge base built from the 2026-10-23 public-only crawl (ADR-0032).
# A rebuild that no longer produces an id named here fails the integrity check, so a changed
# page shows up in the report instead of silently losing its curation.
#
# Values (prices, amounts) are never written here: the guide reads them from the live page.

lexicon:
  synonyms:
    # Products, as Vodafone writes them, with common Egyptian spellings and transliterations.
    - [فودافون فليكس, ڤودافون فليكس, فليكس, flex, vodafone flex]
    - [ريد, رد, نظام ريد, red, vodafone red]
    - [بلس, plus, vodafone plus, ڤودافون بلس, فودافون بلس]
    - [بلس ابس, plus apps, باقات التطبيقات]
    - [فودافون كاش, ڤودافون كاش, كاش, محفظة, vodafone cash, cash, wallet, e-wallet]
    - [انا فودافون, أنا ڤودافون, أنا فودافون, ana vodafone, the app, التطبيق]
    - [الكارت, كارت الكروت, el-kart, el kart, prepaid, كارت]
    - [شكرا, شكراً, shokran]
    # Generic telecom words.
    - [نت, انترنت, إنترنت, الانترنت, الإنترنت, داتا, بيانات, internet, data]
    - [باقة, باقات, باقه, bundle, bundles, plan, plans, package]
    - [ميجا, ميجابايت, mb, mega, megabyte, megabytes]
    - [جيجا, جيجابايت, جيجات, gb, giga, gigabyte, gigabytes]
    - [النت الهوائي, الراوتر الهوائي, هوائي, wireless, home wireless, 4g home]
    - [ارضي, أرضي, dsl, adsl, home dsl, نت البيت, الانترنت المنزلي]
    - [فرع, فروع, الفروع, محل, store, stores, branch, branches, store locator]
    - [تغطية, التغطية, الشبكة, ابراج, coverage, network, signal]
    - [عرض, عروض, العروض, خصم, offer, offers, promo, promotions, deal, deals]
    - [رصيد, balance, credit]
    - [اشحن, شحن, الشحن, recharge, top up, topup]
    - [واي فاي, الواي فاي, wifi, wi-fi]
    # Vodafone writes its business offers in English ("Vodafone Business Red"); people ask in Arabic.
    - [شركات, الشركات, شركة, بيزنس, business]
  intents:
    watch:
      ar: [عرفني لما, بلغني لما, نبهني لما, قولي لو اتغير, ابعتلي لما يتغير, قولي لما]
      en: [tell me when, notify me when, let me know if, alert me when]

