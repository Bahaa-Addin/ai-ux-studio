<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Telco | Sign in</title>
<link rel="alternate" hreflang="ar" href="/ar/login.html">
<link rel="alternate" hreflang="en" href="/en/login.html">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="site"><div class="wrap">
	<a class="logo" href="http://localhost:4401/en/index.html"><img src="/assets/logo.svg" alt=""> Demo Telco</a>
	<a class="lang-switch" href="/ar/login.html" hreflang="ar" lang="ar">العربية</a>
</div></header>
<main class="wrap">
	<h1>Sign in to My account</h1>
	<form class="panel" id="login-form">
		<div class="row"><label for="phone">Mobile number</label><input id="phone" type="tel" value="01000000000" autocomplete="username"></div>
		<div class="row"><label for="password">Password</label><input id="password" type="password" value="demo-only" autocomplete="current-password"></div>
		<button class="btn" type="submit">Sign in</button>
	</form>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
