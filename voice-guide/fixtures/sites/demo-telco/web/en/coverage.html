<main class="wrap">
	<h1>Coverage</h1>
	<h2>Coverage map</h2>
	<figure id="coverage-map">
		<svg role="img" aria-labelledby="map-title map-desc" viewBox="0 0 420 300" width="100%" height="300">
			<title id="map-title">4G and 5G coverage by region</title>
			<desc id="map-desc">5G is available in Cairo, Giza and Alexandria. Aswan has 4G coverage.</desc>
			<rect x="0" y="0" width="420" height="300" fill="#eef3f4"/>
			<path d="M60 40 L170 30 L190 110 L80 120 Z" fill="#0b6e6e"><title>Alexandria: 5G</title></path>
			<path d="M200 120 L300 110 L310 180 L210 190 Z" fill="#0b6e6e"><title>Cairo: 5G</title></path>
			<path d="M150 130 L200 125 L205 195 L145 200 Z" fill="#0b6e6e"><title>Giza: 5G</title></path>
			<path d="M260 220 L330 215 L340 285 L270 290 Z" fill="#8cc7c7"><title>Aswan: 4G</title></path>
			<text x="85" y="80" fill="#fff" font-size="13">Alexandria</text>
			<text x="225" y="155" fill="#fff" font-size="13">Cairo</text>
			<text x="155" y="170" fill="#fff" font-size="13">Giza</text>
			<text x="280" y="258" fill="#14212b" font-size="13">Aswan</text>
		</svg>
		<figcaption>Dark: 5G. Light: 4G.</figcaption>
	</figure>
	<div class="charts">
		<figure id="speed">
			<h2>Average download speed by city</h2>
			<canvas id="speed-chart" width="520" height="230"></canvas>
		</figure>
		<figure id="rollout">
			<h2>5G rollout progress</h2>
			<canvas id="rollout-gl" width="520" height="230"></canvas>
			<figcaption>Share of sites upgraded, by quarter.</figcaption>
		</figure>
	</div>
</main>
