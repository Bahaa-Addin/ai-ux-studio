<main class="wrap">
	<h1>التغطية</h1>
	<h2>خريطة التغطية</h2>
	<figure id="coverage-map">
		<svg role="img" aria-labelledby="map-title map-desc" viewBox="0 0 420 300" width="100%" height="300">
			<title id="map-title">تغطية الجيل الرابع والخامس حسب المنطقة</title>
			<desc id="map-desc">الجيل الخامس متاح في القاهرة والجيزة والإسكندرية. أسوان بها تغطية الجيل الرابع.</desc>
			<rect x="0" y="0" width="420" height="300" fill="#eef3f4"/>
			<path d="M60 40 L170 30 L190 110 L80 120 Z" fill="#0b6e6e"><title>الإسكندرية: الجيل الخامس</title></path>
			<path d="M200 120 L300 110 L310 180 L210 190 Z" fill="#0b6e6e"><title>القاهرة: الجيل الخامس</title></path>
			<path d="M150 130 L200 125 L205 195 L145 200 Z" fill="#0b6e6e"><title>الجيزة: الجيل الخامس</title></path>
			<path d="M260 220 L330 215 L340 285 L270 290 Z" fill="#8cc7c7"><title>أسوان: الجيل الرابع</title></path>
			<text x="95" y="80" fill="#fff" font-size="13">الإسكندرية</text>
			<text x="235" y="155" fill="#fff" font-size="13">القاهرة</text>
			<text x="160" y="170" fill="#fff" font-size="13">الجيزة</text>
			<text x="290" y="258" fill="#14212b" font-size="13">أسوان</text>
		</svg>
		<figcaption>الداكن: الجيل الخامس. الفاتح: الجيل الرابع.</figcaption>
	</figure>
	<div class="charts">
		<figure id="speed">
			<h2>متوسط سرعة التحميل حسب المدينة</h2>
			<canvas id="speed-chart" width="520" height="230"></canvas>
		</figure>
		<figure id="rollout">
			<h2>تقدم تغطية الجيل الخامس</h2>
			<canvas id="rollout-gl" width="520" height="230"></canvas>
			<figcaption>نسبة المواقع المُحدَّثة حسب الربع.</figcaption>
		</figure>
	</div>
</main>
