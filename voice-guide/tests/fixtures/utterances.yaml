# Router evaluation set for demo-telco (ADR-0014). Each case: what someone says,
# where they are, what came before, and what the router must decide.
# `dest` is the expected destination id; `route` and `intent` are checked when given.
# Add every misrouted request from rehearsals and the pilot here, then rerun:
#   npm run eval:router -- --decider local   (or jev / laya)
