<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" data-asset="pocket-drone" data-rig-version="1">
  <!--
    Pocket drone rig. Hand-authored from the IMG_2442 UPLIFT quadcopter (hover frames) as a
    temporary production asset: flat Vodafone red, tapered arms ending in motor pods, open
    calligraphic propeller guards, white hull details. Moving parts carry data-part names and
    pivots (viewBox units): the frame tilts around the hull, each rotor spins inside a
    flattened (perspective) disc, the lift lines pulse while hovering.
  -->
  <g data-part="frame" style="transform-origin: 100px 74px">
    <g data-part="lift-lines" fill="none" stroke="#e60000" stroke-linecap="round" style="transform-origin: 92px 112px">
      <path d="M78 106C82 112 90 116 98 116" stroke-width="2.4"/>
      <path d="M72 112C77 120 88 124 98 124" stroke-width="2"/>
      <path d="M68 119C74 128 86 132 97 132" stroke-width="1.6"/>
    </g>

    <g data-part="rotors">
      <g data-part="rotor-l" style="transform-origin: 24px 82px; transform: scaleY(0.42)">
        <circle cx="24" cy="82" r="26" fill="#e60000" fill-opacity="0.08"/>
        <g data-part="blades" style="transform-origin: 24px 82px">
          <path d="M1 82C1 80.2 47 80.2 47 82C47 83.8 1 83.8 1 82Z" fill="#990000" fill-opacity="0.5"/>
          <path d="M24 59C25.8 59 25.8 105 24 105C22.2 105 22.2 59 24 59Z" fill="#990000" fill-opacity="0.3"/>
        </g>
      </g>
      <g data-part="rotor-t" style="transform-origin: 88px 22px; transform: scaleY(0.42)">
        <circle cx="88" cy="22" r="21" fill="#e60000" fill-opacity="0.08"/>
        <g data-part="blades" style="transform-origin: 88px 22px">
          <path d="M69 22C69 20.4 107 20.4 107 22C107 23.6 69 23.6 69 22Z" fill="#990000" fill-opacity="0.5"/>
          <path d="M88 3C89.6 3 89.6 41 88 41C86.4 41 86.4 3 88 3Z" fill="#990000" fill-opacity="0.3"/>
        </g>
      </g>
      <g data-part="rotor-r" style="transform-origin: 176px 54px; transform: scaleY(0.42)">
        <circle cx="176" cy="54" r="26" fill="#e60000" fill-opacity="0.08"/>
        <g data-part="blades" style="transform-origin: 176px 54px">
          <path d="M153 54C153 52.2 199 52.2 199 54C199 55.8 153 55.8 153 54Z" fill="#990000" fill-opacity="0.5"/>
          <path d="M176 31C177.8 31 177.8 77 176 77C174.2 77 174.2 31 176 31Z" fill="#990000" fill-opacity="0.3"/>
        </g>
      </g>
      <g data-part="rotor-b" style="transform-origin: 114px 122px; transform: scaleY(0.42)">
        <circle cx="114" cy="122" r="23" fill="#e60000" fill-opacity="0.08"/>
        <g data-part="blades" style="transform-origin: 114px 122px">
          <path d="M93 122C93 120.3 135 120.3 135 122C135 123.7 93 123.7 93 122Z" fill="#990000" fill-opacity="0.5"/>
          <path d="M114 101C115.7 101 115.7 143 114 143C112.3 143 112.3 101 114 101Z" fill="#990000" fill-opacity="0.3"/>
        </g>
      </g>
    </g>

    <g data-part="body" fill="#e60000">
      <path d="M89.4 62.3Q61.5 73.1 34.2 77.2L35.1 84Q62.5 80.9 92.3 84.1Z"/>
      <path d="M109.3 63.4Q97.8 46.1 93 28.2L86.4 29.8Q90.2 47.9 87.9 68.6Z"/>
      <path d="M111.7 80.5Q138.9 66.8 166.1 59.8L164.6 53.2Q137.1 59.2 106.6 59.1Z"/>
