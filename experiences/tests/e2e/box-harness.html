<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seam in a box</title>
<script>
  // ?lang=ar: the Arabic page, set before i18n.js and shared.js read it.
  if (new URLSearchParams(location.search).get('lang') === 'ar') {
    document.documentElement.lang = 'ar'
    document.documentElement.dir = 'rtl'
  }
</script>
<link rel="stylesheet" href="/src/host/vodafone-faces.css">
<link rel="stylesheet" href="/src/aixc/experiences/vodafone.css">
<link rel="stylesheet" href="/src/aixc/experiences/spotlight.css">
<link rel="stylesheet" href="/src/aixc/experiences/magazine.css">
<style>
  /* Like Vodafone's static themes: sticky never sticks on the page itself. */
  html, body { overflow-x: hidden; margin: 0; }
  #header { height: 100px; background: #e60000; color: #fff; }
  #experience-output {
    height: var(--aixc-box-h);
    overflow-y: auto;
    overflow-x: clip;
    overscroll-behavior: contain;
    isolation: isolate;
  }
  .aixc-viewbar { position: sticky; top: 0; z-index: 30; box-sizing: border-box; height: 57px; background: #fff; border-bottom: 1px solid #ccc; }
  #footer { height: 1500px; background: #14141e; }
</style>
</head>
<body>
<div id="header">Stand-in header, 100 px</div>
<div id="experience-output" class="aixc-box" data-aixc>
  <div class="aixc-viewbar">Stand-in view bar, 57 px</div>
  <div class="aixc-stage"></div>
</div>
<div id="footer"></div>
<script type="module">
  import * as seam from '/src/aixc/experiences/shared.js'
  import { wrapExperience } from '/src/aixc/experience-wrap.js'
  import { buildTemplateSchema } from '/src/aixc/template-schema.js'
  import { validateSchema } from '/src/aixc/schema-validator.js'
  import { buildContentIndex } from '/src/aixc/content-index.js'
  import { normalizeContentModel } from '/src/host/model.js'
  import { vodafoneServicesPage } from '/src/content/vodafone-services.js'
  import { vodafoneServicesPageAr } from '/src/content/vodafone-services-ar.js'
  import { renderSpotlight } from '/src/aixc/experiences/spotlight.js'
  import { renderMagazine } from '/src/aixc/experiences/magazine.js'

  const box = document.getElementById('experience-output')
  const stage = box.querySelector('.aixc-stage')
  const page = document.documentElement.lang === 'ar' ? vodafoneServicesPageAr : vodafoneServicesPage
  const index = buildContentIndex(normalizeContentModel(page).model)
  const renderers = { spotlight: renderSpotlight, magazine: renderMagazine }
  // Every experience Reimagine has; load(name) brings in the ones not imported above (box_e2e.py's rows).
  const NAMES = ['magazine', 'spotlight', 'journey', 'gallery', 'flipbook', 'cube', 'streaming', 'split', 'fan', 'coverflow', 'canvas', 'tunnel', 'ring']
  const sheet = (href) => {
    const have = [...document.querySelectorAll('link[rel="stylesheet"]')].find((l) => l.getAttribute('href') === href)
    if (have) return have.sheet ? Promise.resolve() : new Promise((resolve, reject) => { have.addEventListener('load', resolve, { once: true }); have.addEventListener('error', () => reject(new Error(`${href} did not load`)), { once: true }) })
    const link = document.createElement('link')
    link.rel = 'stylesheet'
    link.href = href
    const loaded = new Promise((resolve, reject) => { link.onload = resolve; link.onerror = () => reject(new Error(`${href} did not load`)) })
    document.head.append(link)
    return loaded
  }
  let schema = null
  // The safe zones the shell would measure (px): set per test.
  const measure = (zones) => {
    box.style.setProperty('--aixc-box-h', `${innerHeight - 100}px`)
    box.style.setProperty('--aixc-viewbar-h', '57px')
    box.style.setProperty('--aixc-pin-y', `${box.getBoundingClientRect().top + 57}px`)
    for (const [name, value] of Object.entries(zones)) box.style.setProperty(`--aixc-safe-${name}`, `${value}px`)
  }
  let current = null
  window.__h = {
    seam,
    box,
    measure,
    names: NAMES,
    // Imports /src/aixc/experiences/<name>.js (its render<Name>) and adds its stylesheet once; resolves when both are in.
    async load(name) {
      if (!NAMES.includes(name)) throw new Error(`no experience called ${name}`)
      const href = `/src/aixc/experiences/${name}.css`
      if (!renderers[name]) {
        const module = await import(`/src/aixc/experiences/${name}.js`)
        const render = module[`render${name[0].toUpperCase()}${name.slice(1)}`]
        if (typeof render !== 'function') throw new Error(`${name}.js has no render${name[0].toUpperCase()}${name.slice(1)}`)
        renderers[name] = render
      }
      await sheet(href)
      return name
    },
    // `limit`: only the schema's first that many items (a short page: an experience that loops from so many items
    // does not loop below it).
    open(name, { copy = 'services', limit = 0 } = {}) {
      if (!renderers[name]) throw new Error(`${name} is not loaded: await __h.load('${name}') first`)
      current?.unmount()
      seam.configure({ scroller: box, copy })
      schema = validateSchema(buildTemplateSchema({ experience: name }, index), index).schema
      if (limit > 0) {
        let left = limit
        const sections = schema.sections.map((section) => {
          if (section.type === 'closing-promotion') return section
          const itemIds = section.itemIds.slice(0, Math.max(0, left))
          left -= itemIds.length
          return { ...section, itemIds }
        }).filter((section) => section.type === 'closing-promotion' || section.itemIds.length)
        schema = { ...schema, sections }
      }
      current = wrapExperience(renderers[name](schema, index))
      stage.replaceChildren(current.element)
      current.mount()
      return current
    },
    get current() {
      return current
    },
    // The last opened schema's item ids, in order (each should be in the box once).
    get itemIds() {
      return schema ? schema.sections.flatMap((section) => section.itemIds) : []
    },
    close() {
      current?.unmount()
      seam.configure()
    },
  }
  window.__ready = true
</script>
</body>
</html>
